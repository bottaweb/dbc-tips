<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desserts by Clément — Tip Sharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0E0E0E;
    --panel-raised:#181818;
    --ink:#F5F1E8;
    --ink-soft:#9C9488;
    --gold:#CC9966;
    --gold-dark:#A67A4D;
    --line:#262626;
    --line-strong:#3A3A3A;
    --ok:#7FBE8F;
    --ok-bg:#16211A;
    --err:#E08A8A;
    --err-bg:#241616;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{background:#000;}
  button, a, select, input, .qty-btn{touch-action:manipulation;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Cormorant Garamond',Georgia,serif;
    margin:0;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .app{max-width:720px;margin:0 auto;padding:0 18px 60px;}
  header.top{
    padding:30px 0 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid var(--line-strong);
    margin-bottom:20px;
    background:var(--bg);
  }
  header.top .brand{display:flex;flex-direction:column;align-items:center;gap:6px;}
  header.top img.logo{height:52px;width:auto;display:block;}
  header.top .brand small{
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:10px;
    font-weight:600;
  }
  header.top .brand .badge{
    display:inline-block;background:var(--gold);color:#1A140D;
    font-size:11px;font-weight:800;letter-spacing:0.6px;
    padding:3px 10px;border-radius:5px;margin-top:2px;
  }
  nav.tabs{
    display:flex;
    gap:6px;
    background:var(--panel);
    padding:5px;
    border-radius:12px;
    border:1px solid var(--line);
    margin-bottom:24px;
  }
  nav.tabs button{
    flex:1;
    padding:10px 8px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{background:var(--gold);color:#1A140D;}
  nav.tabs button:not(.active):hover{background:var(--panel-raised);color:var(--ink);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{font-size:20px;margin-bottom:14px;color:var(--gold);letter-spacing:0.3px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  select, input[type=text], input[type=number], input[type=date], input[type=password]{
    padding:10px 11px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    font-size:15px;
    background:var(--panel-raised);
    color:var(--ink);
    font-family:inherit;
  }
  select:focus, input:focus{outline:2px solid var(--gold);outline-offset:1px;}

  table.items{width:100%;border-collapse:collapse;}
  table.items th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--ink-soft);padding:8px 6px;border-bottom:1px solid var(--line-strong);
  }
  table.items td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.items input[type=number]{width:90px;text-align:right;}

  button.primary{
    background:var(--gold);color:#1A140D;border:none;padding:12px 20px;
    border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  }
  button.primary:hover{background:var(--gold-dark);}
  button.secondary{
    background:transparent;color:var(--gold);border:1px solid var(--gold);
    padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  }
  button.secondary:hover{background:rgba(204,153,102,0.12);}
  button.ghost{
    background:transparent;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;
    text-decoration:underline;padding:4px;
  }
  button.ghost:hover{color:var(--gold);}
  button.danger{color:var(--err);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#1A140D;padding:14px 24px;border-radius:8px;
    font-size:15px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:999;
    max-width:90%;text-align:center;
  }
  .banner{padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;margin-bottom:14px;}
  .banner.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #2E4034;}
  .banner.err{background:var(--err-bg);color:var(--err);border:1px solid #4A2E2E;}

  .empty{color:var(--ink-soft);font-size:14px;padding:20px 0;text-align:center;}

  .admin-list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .admin-list-row:last-child{border-bottom:none;}
  .admin-list-row .name{flex:1;font-size:14px;}
  .admin-list-row .meta{font-size:12px;color:var(--ink-soft);}

  .helper{font-size:12px;color:var(--ink-soft);margin-top:-6px;margin-bottom:14px;}

  .result-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted var(--line-strong);font-size:15px;}
  .result-line.total{border-top:2px solid var(--gold);border-bottom:none;margin-top:6px;padding-top:12px;font-weight:700;font-size:17px;}
  .result-line .amt{font-weight:700;color:var(--gold);}
  .kitchen-line .amt{color:var(--ok);}

  @media (max-width: 640px){
    .app{max-width:100%;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>

// Storage shim: routes window.storage.get/set/list/delete calls to Netlify
// Functions backed by Netlify Blobs.
(function(){
  async function parseErr(res, fallback){
    try{
      const e = await res.json();
      if(e && e.error) return e.error;
    }catch(_e){}
    return fallback;
  }
  window.storage = {
    async get(key, shared){
      const res = await fetch('/api/storage-get?key=' + encodeURIComponent(key));
      if(!res.ok){
        throw new Error(await parseErr(res, 'Storage get failed: ' + res.status));
      }
      const data = await res.json();
      if(data.value === null || data.value === undefined){
        throw new Error('not found');
      }
      return {key, value: data.value, shared: true};
    },
    async set(key, value, shared){
      const res = await fetch('/api/storage-set', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({key, value}),
      });
      if(!res.ok){
        throw new Error(await parseErr(res, 'Storage set failed: ' + res.status));
      }
      return {key, value, shared: true};
    },
    async list(prefix, shared){
      const res = await fetch('/api/storage-list?prefix=' + encodeURIComponent(prefix||''));
      if(!res.ok){
        throw new Error(await parseErr(res, 'Storage list failed: ' + res.status));
      }
      const data = await res.json();
      return {keys: data.keys||[], prefix, shared: true};
    },
    async delete(key, shared){
      const res = await fetch('/api/storage-delete?key=' + encodeURIComponent(key), {
        method: 'POST',
      });
      if(!res.ok){
        throw new Error(await parseErr(res, 'Storage delete failed: ' + res.status));
      }
      return {key, deleted: true, shared: true};
    },
  };
})();

function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  return '$' + (Math.round((n||0) * 100) / 100).toFixed(2);
}
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-');
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function keyGenuinelyMissing(key){

    return !keys.includes(key);
  }catch(e){

  }
}

async function storageSetWithRetry(key, value, shared, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i=0; i<attempts; i++){
    try{
      const result = await window.storage.set(key, value, shared);
      if(result) return result;
      lastErr = new Error('storage.set returned no result');
    }catch(e){
      lastErr = e;
    }
    if(i < attempts-1){
      await new Promise(r=>setTimeout(r, 600 * (i+1)));
    }
  }
  throw lastErr;
}

async function storageDeleteWithRetry(key, shared, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i=0; i<attempts; i++){
    try{
      await window.storage.delete(key, shared);
      return true;
    }catch(e){
      lastErr = e;
    }
    if(i < attempts-1){
      await new Promise(r=>setTimeout(r, 600 * (i+1)));
    }
  }
  throw lastErr;
}

async function loadCore(){
  try{
    const l = await window.storage.get('locations', true);
    state.locations = l ? JSON.parse(l.value) : [];
    state.locationsLoadedOk = true;
  }catch(e){ state.locations = []; state.locationsLoadedOk = false; }

  if(!state.locationsLoadedOk && state.locations.length === 0 && await keyGenuinelyMissing('locations')){
    state.locations = [
      {id: uid(), name: 'Pacific Beach'},
      {id: uid(), name: 'Del Mar'},
      {id: uid(), name: 'Shop 3'},
    ];
    try{ await window.storage.set('locations', JSON.stringify(state.locations), true); state.locationsLoadedOk = true; }catch(e){}
  }

  for(const loc of state.locations){
    try{
      const s = await window.storage.get(staffKey(loc.id), true);
      state.staffByLocation[loc.id] = s ? JSON.parse(s.value) : [];
      state.staffLoadedOkByLocation[loc.id] = true;
    }catch(e){
      state.staffByLocation[loc.id] = [];
      state.staffLoadedOkByLocation[loc.id] = await keyGenuinelyMissing(staffKey(loc.id));
    }
  }
  state.loaded = true;
}

async function saveLocations(){
  if(!state.locationsLoadedOk){
    throw new Error('Locations list could not be confirmed as loaded this session — refusing to save. Reload the page and try again.');
  }
  await window.storage.set('locations', JSON.stringify(state.locations), true);
}

async function saveStaffFor(locId){
  if(!state.staffLoadedOkByLocation[locId]){
    throw new Error('Staff list for this location could not be confirmed as loaded this session — refusing to save. Reload the page and try again.');
  }
  await window.storage.set(staffKey(locId), JSON.stringify(state.staffByLocation[locId] || []), true);
}

function calculateShares(){
  const total = parseFloat(state.calcTotalTips) || 0;
  const kitchenPool = total * 0.15;
  const distributable = total * 0.85;
  const staffList = state.staffByLocation[state.calcLocation] || [];
  const entries = staffList.map(s => ({
    staffId: s.id,
    name: s.name,
    hours: parseFloat(state.calcHours[s.id]) || 0,
  }));
  const totalHours = entries.reduce((sum,e)=> sum + e.hours, 0);
  const shares = entries.map(e => ({
    ...e,
    amount: totalHours > 0 ? (e.hours / totalHours) * distributable : 0,
  }));
  return { total, kitchenPool, distributable, totalHours, shares };
}

      const delBtn = document.createElement('button');
      delBtn.className = 'ghost danger';
      delBtn.textContent = 'Delete';
      delBtn.onclick = async ()=>{
        if(!confirm('Delete the saved pay period for ' + fmtDate(p.periodEnd) + '? This cannot be undone.')) return;

          state.historyList = state.historyList.filter(x=>x.periodEnd !== p.periodEnd);
          if(state.historyDetail && state.historyDetail.periodEnd === p.periodEnd) state.historyDetail = null;
          render();
        }catch(err){

        }
      };
      r.appendChild(viewBtn);

    });

    wrap.appendChild(renderResultCard({

      kitchenPool: state.historyDetail.kitchenPool,
      distributable: state.historyDetail.distributable,
      totalHours: state.historyDetail.totalHours,
      shares: state.historyDetail.shares,
    }, false));
  }

  return wrap;
}

async function loadHistoryFor(locId){
  state.historyLoading = true;
  render();
  try{
    const r = await window.storage.list(periodKey(locId, ''), true);
    const keys = (r && r.keys) || [];
    const periods = [];
    for(const k of keys){
      try{
        const rec = await window.storage.get(k, true);
        if(rec) periods.push(JSON.parse(rec.value));
      }catch(e){}
    }
    periods.sort((a,b)=> b.periodEnd.localeCompare(a.periodEnd));
    state.historyList = periods;
  }catch(e){
    state.historyList = [];
  }
  state.historyLoading = false;
  render();
}

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'tips-backup-' + dateStr + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  backupCard.appendChild(backupBtn);
  wrap.appendChild(backupCard);

  return wrap;
}

(async function init(){
  render();
  await loadCore();
  render();
})();

</script>
